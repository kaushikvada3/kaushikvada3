 <pattern id="macro" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 1h8" stroke="#627e90" opacity=".4"/></pattern>
</defs>
<rect width="960" height="184" rx="16" fill="url(#bg)"/>
<rect x="20" y="16" width="920" height="152" fill="url(#cells)"/>
<g fill="#273f50" stroke="#667f90"><rect x="120" y="30" width="156" height="64" rx="3"/><rect x="380" y="100" width="176" height="52" rx="3"/><rect x="650" y="30" width="134" height="68" rx="3"/></g>
<path d="M124 34h148v56H124z M384 104h168v44H384z M654 34h126v60H654z" fill="url(#macro)"/>
