<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 184" role="img" aria-labelledby="title desc">
<title id="title">A signal path across a chip floorplan</title>
<desc id="desc">An illustrative turquoise route connects two cells among muted rows of logic and larger memory blocks.</desc>
